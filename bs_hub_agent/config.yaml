name: Brightstay Hub Agent
version: "0.4.1"
slug: bs_hub_agent
description: Relie le logement à Brightstay — remonte ce que voit le boîtier, applique ce qu'on lui demande, et sert la page de la tablette.
url: https://github.com/Brightstay/addons/tree/main/bs_hub_agent
arch: [aarch64, amd64]

startup: application
boot: auto
init: false

homeassistant_api: true

hassio_api: true
hassio_role: manager

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Écran de la tablette (réseau local uniquement)

map:
  - homeassistant_config:rw
  - ssl:ro

options:
  sync_interval: 300
  hub_sync_url: ""
  hub_key: ""
  ha_token: ""
schema:
  sync_interval: int(30,3600)
  hub_sync_url: "str?"
  hub_key: "password?"
  ha_token: "password?"
