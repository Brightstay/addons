# Sur quelle base construire, selon le type de machine.
#
# Sans ce fichier, la fabrication échoue avec « base name should not be blank » :
# le Dockerfile attend cette valeur et personne ne la lui donne.
#
# Ce sont les images officielles Home Assistant. Elles apportent bashio, dont
# se sert le script de démarrage pour lire les réglages de l'add-on.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.19
  amd64: ghcr.io/home-assistant/amd64-base:3.19
